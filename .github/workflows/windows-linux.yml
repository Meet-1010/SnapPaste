name: Windows & Linux builds

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "crossplatform/**"
      - ".github/workflows/windows-linux.yml"
  pull_request:
    paths:
      - "crossplatform/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            asset: SnapPaste-Windows-x64.exe
          - name: Linux x86_64
            # Building on the oldest supported Ubuntu keeps the binary compatible with older glibc.
            os: ubuntu-22.04
            asset: SnapPaste-Linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: crossplatform
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libclang-dev \
            libgtk-3-dev libxdo-dev libayatana-appindicator3-dev \
            libxcb1-dev libxrandr-dev libxkbcommon-dev libx11-dev \
            libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crossplatform

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/snappaste.exe dist/${{ matrix.asset }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/SnapPaste
          cp target/release/snappaste dist/SnapPaste/
          cp packaging/linux/install.sh packaging/linux/uninstall.sh packaging/linux/snappaste.desktop dist/SnapPaste/
          cp assets/icon-256.png dist/SnapPaste/snappaste.png
          cp README.md dist/SnapPaste/README.md
          tar -C dist -czf dist/${{ matrix.asset }} SnapPaste

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: crossplatform/dist/${{ matrix.asset }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: crossplatform/dist/${{ matrix.asset }}
