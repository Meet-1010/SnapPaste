[package]
name = "snappaste"
version = "1.0.0"
edition = "2021"
description = "Clipboard-first screenshot tool for Windows and Linux"
license = "MIT"
publish = false

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.37"
epaint_default_fonts = "0.37"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tiny-skia = "0.12"
ab_glyph = "0.2"
xcap = "0.9"
arboard = { version = "3.7", features = ["image-data", "wayland-data-control"] }
global-hotkey = "0.9"
tray-icon = "0.26"
mouse_position = "0.1"
auto-launch = "0.6"
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ocrs = "0.13"
rten = "0.26"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# OCR inference is unusably slow without optimizations, so optimize dependencies in dev/test too.
[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
